name: Protected release

on:
  workflow_dispatch:
  push:
    tags: ["v2.*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: pcconnect-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PCCONNECT_TESTCONTAINERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: "10.0.101", cache: true, cache-dependency-path: "**/packages.lock.json" }
      - run: python contracts/check_contracts.py
      - run: python tools/check_android_security.py
      - run: python tools/check_release_hygiene.py
      - run: dotnet restore PCConnect.slnx --locked-mode
      - run: dotnet build PCConnect.slnx -c Release --no-restore
      - run: dotnet test tests/PCConnect.UnitTests/PCConnect.UnitTests.csproj -c Release --no-build --no-restore
      - run: dotnet test tests/PCConnect.IntegrationTests/PCConnect.IntegrationTests.csproj -c Release --no-build --no-restore
      - run: dotnet list PCConnect.slnx package --vulnerable --include-transitive
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  windows:
    needs: validation
    runs-on: windows-latest
    environment: release
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: "10.0.101", cache: true, cache-dependency-path: "**/packages.lock.json" }
      - name: Materialize protected signing certificate
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.PCCONNECT_WINDOWS_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) { throw "Protected Windows signing certificate is not configured." }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/pcconnect-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
      - name: Restore, test and publish
        shell: pwsh
        run: |
          dotnet restore PCConnect.slnx --locked-mode
          dotnet test tests/PCConnect.WindowsTests/PCConnect.WindowsTests.csproj -c Release --no-restore
          dotnet publish src/PCConnect.Windows.Agent/PCConnect.Windows.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:RestoreLockedMode=true -o artifacts/windows/agent
          dotnet publish src/PCConnect.Windows.Companion/PCConnect.Windows.Companion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:RestoreLockedMode=true -o artifacts/windows/companion
      - name: Sign applications, build MSI, and verify signatures
        shell: pwsh
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.PCCONNECT_WINDOWS_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.PCCONNECT_WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) { throw "Protected Windows signing password is not configured." }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { throw "Trusted timestamp URL is not configured." }
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe was not found." }
          $sign = @('sign','/fd','SHA256','/td','SHA256','/tr',$env:WINDOWS_TIMESTAMP_URL,'/f',"$env:RUNNER_TEMP/pcconnect-signing.pfx",'/p',$env:WINDOWS_PFX_PASSWORD)
          & $signtool @sign artifacts/windows/agent/PCConnect.Windows.Agent.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $signtool @sign artifacts/windows/companion/PCConnect.Windows.Companion.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build installer/PCConnect.Windows.Setup/PCConnect.Windows.Setup.wixproj -c Release -p:RestoreLockedMode=true -p:AgentPublishDir="$pwd/artifacts/windows/agent" -p:CompanionPublishDir="$pwd/artifacts/windows/companion"
          $msi = (Get-ChildItem installer/PCConnect.Windows.Setup/bin/x64/Release/*.msi).FullName
          & $signtool @sign $msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $signtool verify /pa /all artifacts/windows/agent/PCConnect.Windows.Agent.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $signtool verify /pa /all artifacts/windows/companion/PCConnect.Windows.Companion.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $signtool verify /pa /all $msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            artifacts/windows/agent/PCConnect.Windows.Agent.exe
            artifacts/windows/companion/PCConnect.Windows.Companion.exe
            installer/PCConnect.Windows.Setup/bin/x64/Release/*.msi
          if-no-files-found: error

  android:
    needs: validation
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Materialize protected Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.PCCONNECT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pcconnect-release.jks"
          chmod 600 "$RUNNER_TEMP/pcconnect-release.jks"
      - name: Verify Android WebAuthn signing identity
        env:
          PCCONNECT_ANDROID_API_BASE_URL: ${{ vars.PCCONNECT_ANDROID_API_BASE_URL }}
          PCCONNECT_ANDROID_RP_HOST: ${{ vars.PCCONNECT_ANDROID_RP_HOST }}
          PCCONNECT_ANDROID_CERT_SHA256: ${{ vars.PCCONNECT_ANDROID_CERT_SHA256 }}
          PCCONNECT_ANDROID_WEBAUTHN_ORIGIN: ${{ vars.PCCONNECT_ANDROID_WEBAUTHN_ORIGIN }}
          PCCONNECT_ANDROID_STORE_PASSWORD: ${{ secrets.PCCONNECT_ANDROID_STORE_PASSWORD }}
          PCCONNECT_ANDROID_KEY_ALIAS: ${{ secrets.PCCONNECT_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$PCCONNECT_ANDROID_API_BASE_URL"
          test -n "$PCCONNECT_ANDROID_RP_HOST"
          test -n "$PCCONNECT_ANDROID_CERT_SHA256"
          test -n "$PCCONNECT_ANDROID_WEBAUTHN_ORIGIN"
          keytool -exportcert -keystore "$RUNNER_TEMP/pcconnect-release.jks" -storepass "$PCCONNECT_ANDROID_STORE_PASSWORD" -alias "$PCCONNECT_ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/pcconnect-release.cer"
          hex=$(openssl dgst -sha256 "$RUNNER_TEMP/pcconnect-release.cer" | awk '{print toupper($2)}')
          fingerprint=$(printf '%s' "$hex" | sed 's/../&:/g;s/:$//')
          origin_hash=$(openssl dgst -sha256 -binary "$RUNNER_TEMP/pcconnect-release.cer" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          test "$fingerprint" = "$PCCONNECT_ANDROID_CERT_SHA256" || { echo "Configured Digital Asset Links fingerprint does not match the release certificate" >&2; exit 1; }
          test "android:apk-key-hash:$origin_hash" = "$PCCONNECT_ANDROID_WEBAUTHN_ORIGIN" || { echo "Configured Android WebAuthn origin does not match the release certificate" >&2; exit 1; }
      - name: Test, lint and create signed bundle
        env:
          PCCONNECT_ANDROID_API_BASE_URL: ${{ vars.PCCONNECT_ANDROID_API_BASE_URL }}
          PCCONNECT_ANDROID_RP_HOST: ${{ vars.PCCONNECT_ANDROID_RP_HOST }}
          PCCONNECT_ANDROID_KEYSTORE: ${{ runner.temp }}/pcconnect-release.jks
          PCCONNECT_ANDROID_STORE_PASSWORD: ${{ secrets.PCCONNECT_ANDROID_STORE_PASSWORD }}
          PCCONNECT_ANDROID_KEY_ALIAS: ${{ secrets.PCCONNECT_ANDROID_KEY_ALIAS }}
          PCCONNECT_ANDROID_KEY_PASSWORD: ${{ secrets.PCCONNECT_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x AndroidV2/gradlew
          AndroidV2/gradlew -p AndroidV2 testDebugUnitTest lintRelease bundleRelease --no-daemon --stacktrace
          jarsigner -verify AndroidV2/app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-signature.txt" 2>&1
          grep -q '^jar verified\.$' "$RUNNER_TEMP/aab-signature.txt"
          grep '^jar verified\.$' "$RUNNER_TEMP/aab-signature.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: AndroidV2/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  containers:
    needs: validation
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: src/PCConnect.Api/Dockerfile }
          - { name: worker, dockerfile: src/PCConnect.Worker/Dockerfile }
          - { name: migrator, dockerfile: tools/PCConnect.DatabaseMigrator/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require immutable .NET base images
        env:
          DOTNET_SDK_IMAGE: ${{ vars.PCCONNECT_DOTNET_SDK_IMAGE }}
          DOTNET_ASPNET_IMAGE: ${{ vars.PCCONNECT_DOTNET_ASPNET_IMAGE }}
          DOTNET_RUNTIME_IMAGE: ${{ vars.PCCONNECT_DOTNET_RUNTIME_IMAGE }}
        run: |
          for reference in "$DOTNET_SDK_IMAGE" "$DOTNET_ASPNET_IMAGE" "$DOTNET_RUNTIME_IMAGE"; do
            printf '%s' "$reference" | grep -Eq '@sha256:[0-9a-f]{64}$' || { echo "Release .NET base image is not digest-pinned" >&2; exit 1; }
          done
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            DOTNET_SDK_IMAGE=${{ vars.PCCONNECT_DOTNET_SDK_IMAGE }}
            DOTNET_RUNTIME_IMAGE=${{ matrix.name == 'api' && vars.PCCONNECT_DOTNET_ASPNET_IMAGE || vars.PCCONNECT_DOTNET_RUNTIME_IMAGE }}
          tags: ghcr.io/${{ github.repository_owner }}/pcconnect-${{ matrix.name }}:${{ github.ref_name }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/pcconnect-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/pcconnect-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable deployment reference
        run: |
          mkdir -p container-digests
          printf '%s@%s\n' 'ghcr.io/${{ github.repository_owner }}/pcconnect-${{ matrix.name }}' '${{ steps.build.outputs.digest }}' > 'container-digests/${{ matrix.name }}.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-${{ matrix.name }}-digest
          path: container-digests/${{ matrix.name }}.txt
          if-no-files-found: error

  provenance:
    needs: [windows, android, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release
          format: cyclonedx-json
          output-file: release/pcconnect-release.sbom.cdx.json
      - name: Create checksums
        run: find release -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/**
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: |
            release/SHA256SUMS
            release/pcconnect-release.sbom.cdx.json
          if-no-files-found: error
