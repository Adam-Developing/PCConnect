name: Architecture contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "DB/v2-canonical-schema.sql"
      - "docs/architecture/**"
      - ".github/workflows/architecture-contracts.yml"
  push:
    branches: [main, PCConnect2]
    paths:
      - "contracts/**"
      - "DB/v2-canonical-schema.sql"
      - "docs/architecture/**"
      - ".github/workflows/architecture-contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.3-alpine3.22@sha256:af27ebd3413839ccfdcdf88e91ca76ad82117e52192067b76de9bb5be7ea6e04
        env:
          POSTGRES_DB: pcconnect_contract
          POSTGRES_USER: pcconnect_contract
          POSTGRES_PASSWORD: contract-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcconnect_contract -d pcconnect_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate cross-contract invariants
        run: python contracts/check_contracts.py

      - name: Validate JSON Schema metaschemas
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          cases = (
              ("contracts/named-pipe-v1.schema.json", "contracts/examples/named-pipe-execute-request.json"),
              ("contracts/migration-manifest.schema.json", "contracts/examples/migration-manifest.json"),
          )
          for schema_name, example_name in cases:
              schema = json.loads(Path(schema_name).read_text(encoding="utf-8"))
              example = json.loads(Path(example_name).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(example)
              print(f"valid schema/example: {schema_name} / {example_name}")
          PY

      - name: Apply canonical PostgreSQL schema
        env:
          PGPASSWORD: contract-test-only
        run: >-
          psql
          --host=127.0.0.1
          --username=pcconnect_contract
          --dbname=pcconnect_contract
          --set=ON_ERROR_STOP=1
          --file=DB/v2-canonical-schema.sql

      - name: Verify required PostgreSQL tables
        env:
          PGPASSWORD: contract-test-only
        run: |
          actual=$(psql --host=127.0.0.1 --username=pcconnect_contract --dbname=pcconnect_contract --tuples-only --no-align --command="SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")
          test "$actual" -ge 22
