# PostgreSQL 18 — tuned for one small VM, not for a fleet.
#
# The values here assume 2 vCPU and 4 GB RAM, which is what the product runs on
# today. They are deliberately unremarkable: a solo maintainer should be able to
# read this file and know why every line is here (08 §1.1).

listen_addresses = '*'          # only reachable on the compose-internal network
max_connections = 100

shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

wal_level = replica
max_wal_size = 2GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

# Point-in-time recovery needs WAL retained; 5 minutes of loss is the RPO the
# architecture commits to once shipping is enabled (02 §9).
wal_keep_size = 512MB
archive_mode = off

random_page_cost = 1.1          # SSD
effective_io_concurrency = 200

# Every statement over a second is a bug that has not been found yet.
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# UTC everywhere. The v1 schema had no timezone at all (S2-07); this makes the
# server's own answer unambiguous too.
timezone = 'UTC'
log_timezone = 'UTC'

datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
