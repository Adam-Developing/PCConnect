global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yaml

scrape_configs:
  - job_name: pcconnect-otel
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: pcconnect-backup-jobs
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: pcconnect-vps
    static_configs:
      - targets: ["node-exporter:9100"]
